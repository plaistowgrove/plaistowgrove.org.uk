<ol class="grid">
    {%- for update in collections.news | slice(6) | first -%}
        <li class="grid-item">
            <article class="card">
                <h3 class="title">
                    <a href="{{ update.page.url }}" class="main">{{ update.data.title }}</a>
                </h3>
                <time datetime="{{ update.page.date.toISOString().split('T') | first }}">{{ update.page.date | datestring({ day: "numeric", month: "short", year: "2-digit" }) }}</time>
            </article>
        </li>
    {%- endfor -%}
</ul>
